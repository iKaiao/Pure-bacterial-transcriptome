name: BactRNAseq
channels:
  - conda-forge
  - bioconda
dependencies:
  # Keep this environment independent of the base Python 3.14 pin.
  - python=3.11

  # Read processing, mapping and quantification.
  - openjdk=17
  - trimmomatic=0.40
  - bowtie2
  - subread>=2.0.2

  # Font fallback for PDF and PNG output on headless systems.
  - font-ttf-dejavu-sans-mono
