package:
  name: pure-bacterial-transcriptome
  version: 0.1.1

source:
  path: ..

build:
  number: 1
  skip: true  # [win]
  script: cargo install --locked --no-track --path . --root "$PREFIX"

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  run:
    - openjdk 17.*
    - trimmomatic 0.40.*
    - bowtie2
    - subread >=2.0.2
    - font-ttf-dejavu-sans-mono

test:
  commands:
    - pure-bacterial-transcriptome --version
    - pure-bacterial-transcriptome --help
    - bowtie2 --version
    - featureCounts -v

about:
  home: https://github.com/iKaiao/Pure-bacterial-transcriptome
  license: MIT
  license_file: LICENSE
  summary: Paired-end bacterial RNA-seq differential-expression workflow
