[package]
name = "pure-bacterial-transcriptome"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
description = "Paired-end bacterial RNA-seq differential-expression workflow"
license = "MIT"
repository = "https://github.com/iKaiao/Pure-bacterial-transcriptome"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
flate2 = "1.1"
nalgebra = "0.35"
noodles-bam = "0.85"
noodles-sam = "0.81"
png = "0.17"
regex = "1.12"
resvg = "0.45"
rsdeseq2 = "=0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
tempfile = "3.20"
which = "8.0"
